name: "Test: Run Unit Tests"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Test Suite
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Version
        run: |
          if [[ -d /Applications/Xcode_16.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r | head -n 1)"
            if [[ -n "$latest_xcode" ]]; then
              sudo xcode-select -s "$latest_xcode/Contents/Developer"
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Test Cases
        run: |
          xcodebuild test \
            -project juicer.xcodeproj \
            -scheme juicer \
            -sdk macosx \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
