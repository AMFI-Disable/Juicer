name: "Security: CodeQL SAST Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Scan
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Version
        run: |
          if [[ -d /Applications/Xcode_16.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r | head -n 1)"
            if [[ -n "$latest_xcode" ]]; then
              sudo xcode-select -s "$latest_xcode/Contents/Developer"
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'swift'

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Swift Application for CodeQL
        run: |
          xcodebuild build \
            -project juicer.xcodeproj \
            -scheme juicer \
            -sdk macosx \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
