name: "CI: Build macOS Application"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build macOS Target
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Version
        run: |
          if [[ -d /Applications/Xcode_16.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r | head -n 1)"
            if [[ -n "$latest_xcode" ]]; then
              sudo xcode-select -s "$latest_xcode/Contents/Developer"
            fi
          fi

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: arch -arm64 brew install xcodegen

      - name: Generate Xcode Project
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          xcodegen generate

      - name: Build macOS Target (skip signing)
        run: |
          xcodebuild build \
            -project juicer.xcodeproj \
            -scheme juicer \
            -sdk macosx \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
