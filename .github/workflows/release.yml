name: "Release: Package & Publish GitHub Release"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    name: Package macOS Release
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Version
        run: |
          if [[ -d /Applications/Xcode_16.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r | head -n 1)"
            if [[ -n "$latest_xcode" ]]; then
              sudo xcode-select -s "$latest_xcode/Contents/Developer"
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project juicer.xcodeproj \
            -scheme juicer \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/JuicerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Release App
        run: |
          xcodebuild build \
            -project juicer.xcodeproj \
            -scheme juicer \
            -configuration Release \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/JuicerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO

      - name: Create Archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/JuicerDerivedData/Build/Products/Release/Juicer.app" \
            juicer.zip
          shasum -a 256 juicer.zip | tee juicer.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" juicer.zip juicer.zip.sha256 \
            --title "Juicer ${GITHUB_REF_NAME}" \
            --generate-notes || gh release upload "${GITHUB_REF_NAME}" juicer.zip juicer.zip.sha256 --clobber
