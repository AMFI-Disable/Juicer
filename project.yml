name: juicer
options:
  bundleIdPrefix: com.even.juicer
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  juicer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: sources
      - path: sources/resources/appicon.icns
    dependencies:
      - package: Sparkle
        codeSignOnCopy: true
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_ENTITLEMENTS: sources/resources/juicer.entitlements
      INFOPLIST_FILE: sources/resources/info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.even.juicer
      PRODUCT_NAME: Juicer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: appicon
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--deep"
    postCompileScripts:
      - name: Deep Re-sign Embedded Frameworks and Dylibs
        script: |
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          if [ -d "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" ]; then
            find "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" -name "*.dylib" -o -name "*.framework" | xargs -I {} codesign --force --sign - "{}"
            codesign --force --deep --sign - "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          fi
  juicerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: tests
    dependencies:
      - target: juicer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.even.juicer.tests
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Juicer.app/Contents/MacOS/Juicer"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  juicer:
    build:
      targets:
        juicer: all
    test:
      targets:
        - juicerTests
    run:
      environmentVariables:
        OS_ACTIVITY_MODE: disable
